name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate-data
      - name: Regenerate front-end data
        run: npm run generate-data
      - name: Check generated output is committed
        run: git diff --exit-code -- src/generated
      - name: Typecheck
        run: npm run typecheck
      - name: Syntax-check scripts
        run: npm run check:scripts
